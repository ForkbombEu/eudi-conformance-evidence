version: "3"

tasks:
  test:
    cmds:
      - go test ./...

  coverage-check:
    cmds:
      - |
        coverage_file="${COVERAGE_FILE:-/tmp/eudi-conformance-evidence-coverage.out}"
        coverage_min="${COVERAGE_MIN:-80}"
        go test ./... -covermode=atomic -coverprofile="$coverage_file"
        go tool cover -func="$coverage_file" | awk -v min="$coverage_min" '/^total:/ {
          gsub("%", "", $3)
          printf "Total coverage: %s%% (required: %s%%)\n", $3, min
          if (($3 + 0) < (min + 0)) exit 1
        }'

  lint:
    cmds:
      - go vet ./...
      - task lint:design

  lint:design:
    cmds:
      - if [ -f DESIGN.md ]; then npx --yes @google/design.md lint DESIGN.md; fi

  run:
    cmds:
      - go run .

  build:
    cmds:
      - go build -o bin/eudi-conformance-evidence .

  fmt:
    cmds:
      - go fmt ./...
      - go vet ./...
